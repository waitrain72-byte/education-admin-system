server:
  port: 9091
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    # 不开启 allowMultiQueries：禁止一次请求执行多条 SQL，作为 SQL 注入的防御纵深
    url: jdbc:mysql://${ip}:3306/xm_educational_manager?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      # 上传大小限制（配合 FileController 扩展名白名单）：20MB 足够作业文档/图片
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    # 走 slf4j 而不是 StdOutImpl：StdOutImpl 无条件把每条 SQL 与每个绑定参数打到 stdout，
    # 生产环境会刷爆容器日志，且 BCrypt 密码哈希会作为 SQL 参数落进日志文件。
    # 调试需要看 SQL 时把下面的 logging.level 临时改成 debug 即可。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

logging:
  level:
    # 改成 debug 可打印 SQL 与参数（仅本地排查时使用）
    com.example.mapper: warn

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: countSql

# JWT 签名密钥独立配置（可通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:xm-edu-manager-jwt-secret-2026}
  expire-hours: 2

# 允许跨域的前端来源白名单（逗号分隔，可通过环境变量覆盖）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

ip: localhost
