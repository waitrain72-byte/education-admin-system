server:
  port: 9091
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    # 不开启 allowMultiQueries：禁止一次请求执行多条 SQL，作为 SQL 注入的防御纵深
    url: jdbc:mysql://${ip}:3306/xm_educational_manager?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      # 上传大小限制（配合 FileController 扩展名白名单）：20MB 足够作业文档/图片
      max-file-size: 20MB
      max-request-size: 20MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: countSql

# JWT 签名密钥独立配置（可通过环境变量 JWT_SECRET 覆盖）
jwt:
  secret: ${JWT_SECRET:xm-edu-manager-jwt-secret-2026}
  expire-hours: 2

# 允许跨域的前端来源白名单（逗号分隔，可通过环境变量覆盖）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

ip: localhost
