# WebSocket 升级头映射（本文件被 include 进 http 上下文，map 需位于 server 之外）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# gzip 压缩：nginx 官方镜像默认关闭 gzip，未开启时首屏需下载约 1.5MB 的 JS。
# 开启后 element-plus 493KB→154KB、vue 504KB→179KB、echarts 353KB→120KB。
# 注意 nginx 1.25 起 mime.types 把 .js 映射为 text/javascript（旧版是
# application/javascript），两者都必须列出，否则 JS 不会被压缩。
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 产物文件名带内容哈希，内容变则文件名变，可安全长期缓存。
    # 只用一个 Cache-Control（不用 expires 指令，避免产出重复的 Cache-Control 头）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 入口 HTML 绝不缓存：否则发版后用户仍拿旧 HTML，引用到已被删除的旧哈希资源
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # 前端 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理：/api/xxx -> http://backend:9091/xxx
    # 附带 WebSocket 升级头：实时通知（/api/ws/notice）也经此转发
    location /api/ {
        proxy_pass http://backend:9091/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
