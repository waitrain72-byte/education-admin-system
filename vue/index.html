<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico">
  <title>教务管理系统</title>
  <script>
    // 诊断辅助：捕获启动阶段运行时错误（白屏/异常跳转排查用）
    window.__appErrors = []
    window.addEventListener('error', function (e) {
      window.__appErrors.push((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''))
    })
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason
      window.__appErrors.push('unhandledrejection: ' + ((r && (r.stack || r.message)) || String(r)))
    })
  </script>
  <script>
    // 防闪烁：应用挂载前根据本地偏好/系统颜色模式预设 dark 类，
    // 与 src/composables/useTheme.ts 中的 storageKey 保持一致
    (function () {
      try {
        var mode = localStorage.getItem('xm-color-mode') || 'auto'
        var dark = mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')

        // 自定义主题色同样要在挂载前铺上，否则首屏会先闪一下默认靛蓝再变色。
        // 这里只写基色，完整的派生层级由 composables/useThemeColor.ts 接管。
        var color = localStorage.getItem('xm-theme-color') || ''
        if (/^#[0-9a-fA-F]{6}$/.test(color)) {
          document.documentElement.style.setProperty('--el-color-primary', color)
          document.documentElement.style.setProperty('--xm-brand', color)
        }
      } catch (e) { /* 忽略存储不可用的情况 */ }
    })()
  </script>
</head>
<body>
<noscript>
  <strong>该应用需要启用 JavaScript 才能正常运行，请在浏览器设置中启用后刷新页面。</strong>
</noscript>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
