version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xm_educational_manager
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    healthcheck:
      # 数据库就绪检查：backend 等 healthy 后再启动，避免连库失败反复重启
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本按文件名顺序执行：建表导数据 → theme/locale 迁移 → 日志表 → 演示账号与演示业务数据
      - ./sql/xm_educational_manager.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/add_theme_column.sql:/docker-entrypoint-initdb.d/02-theme.sql:ro
      - ./sql/add_locale_column.sql:/docker-entrypoint-initdb.d/03-locale.sql:ro
      - ./sql/add_log_tables.sql:/docker-entrypoint-initdb.d/04-log.sql:ro
      - ./sql/add_demo_accounts.sql:/docker-entrypoint-initdb.d/05-demo-accounts.sql:ro
      - ./sql/add_demo_data.sql:/docker-entrypoint-initdb.d/06-demo-data.sql:ro

  backend:
    build: ./springboot
    container_name: edu-backend
    environment:
      IP: mysql
      JWT_SECRET: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SPRING_DATASOURCE_PASSWORD: "123456"
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - files_data:/app/files

  frontend:
    build: ./vue
    container_name: edu-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  files_data:
