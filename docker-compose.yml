version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xm_educational_manager
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    healthcheck:
      # 数据库就绪检查：backend 等 healthy 后再启动，避免连库失败反复重启
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动导入种子：表结构 + 索引 + 精简演示数据 + RBAC 授权（日志表仅结构），
      # 备份自带 RBAC 与索引，无需再执行其它脚本
      - ./sql/xm_educational_manager-full.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build: ./springboot
    container_name: edu-backend
    environment:
      IP: mysql
      JWT_SECRET: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SPRING_DATASOURCE_PASSWORD: "123456"
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 绑定宿主机 files 目录：种子引用的 5 个演示头像随仓库分发，部署后头像即可显示；
      # 运行期上传的文件也落在仓库目录，便于备份
      - ./files:/app/files

  frontend:
    build: ./vue
    container_name: edu-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
