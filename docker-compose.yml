version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: edu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: xm_educational_manager
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    healthcheck:
      # 数据库就绪检查：backend 等 healthy 后再启动，避免连库失败反复重启
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动导入完整数据库备份：全部表结构 + 完整演示数据（含 RBAC 权限表、每教师的
      # 课程/选课/成绩/考勤/作业/评教）。备份已是全量，无需再单独导入 rbac_permission.sql。
      - ./sql/xm_educational_manager-full.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  backend:
    build: ./springboot
    container_name: edu-backend
    environment:
      IP: mysql
      JWT_SECRET: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      SPRING_DATASOURCE_PASSWORD: "123456"
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - files_data:/app/files

  frontend:
    build: ./vue
    container_name: edu-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  files_data:
